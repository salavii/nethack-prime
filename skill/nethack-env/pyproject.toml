[project]
name = "nethack-env"
version = "0.1.0"
description = "Minimal NLE (NetHack) text bridge for the Prime Agent kernel"
requires-python = ">=3.11"
dependencies = [
    "nle",
    "gymnasium",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nethack_env"]
